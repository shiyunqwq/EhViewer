name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest   # 你的项目原本在 Windows 环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- ① 安装并配置 JDK ----------
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'      # 也可以用 'adopt'、'zulu' 等
          java-version: '11'           # 项目要求的版本（若使用 17 请改成 17）
          cache: 'gradle'              # 可选：缓存 Gradle 包，提高后续构建速度

      # （可选）显式把 JAVA_HOME 写入环境变量，防止某些步骤读取不到
      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # ---------- ② 其它项目所需的准备 ----------
      # 如有需要的 Android SDK/NDK、Gradle wrapper 权限等，可在这里添加

      # ---------- ③ 执行构建 ----------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
