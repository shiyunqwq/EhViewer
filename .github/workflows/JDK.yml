name: Android CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ 安装 JDK（这里以 AdoptOpenJDK 11 为例）
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'   # or 'adopt'
          java-version: '11'
          cache: 'gradle'

      # ✅ （可选）显式声明 JAVA_HOME，确保 Gradle 能读取
      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # ✅ 构建
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
